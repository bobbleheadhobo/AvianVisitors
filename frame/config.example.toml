# AvianVisitors e-ink frame. install.sh writes this for you; edit to taste.
# config.toml is gitignored. Nothing here is secret unless your whole site is
# behind basic-auth (see the bottom). This file is the full reference.

# --- Where the collage comes from -------------------------------------------
# Default: mirror the BirdNET-Pi on your network. This Pi screenshots it.
base_url = "http://birdnet.local"
shoot = true

# Or fetch a ready-made PNG instead of rendering here (lighter, but needs
# something that serves a frame image, e.g. a public Cloudflare Worker):
# shoot = false
# image_url = "https://bird.onethreenine.net/frame.png?k=YOUR_FRAME_KEY"
# Or read a PNG a sibling process drops next to us:
# image = "~/.birdframe/frame.png"

# Or render from BirdWeather, no mic. Choose one locator. The panel still
# refreshes only when that source's top birds change:
# species_source = "birdweather"
# zip = "94107"
# bw_station_id = "12345"  # public number at the end of the station-page URL; use instead of zip
# bw_days = 7          # BirdWeather lookback window, in days
# bw_country = "us"    # geocoder country for the ZIP
# shoot = true         # this Pi renders the collage

hours = 24             # window shown on the frame

# --- Titles and look (used when this Pi renders, i.e. shoot = true) ----------
shoot_title = "Avian Visitors"
shoot_subtitle = "Heard Today"
# Set shoot_title = "" to hide the frame title without hiding bird names.
bird_names = false       # run `birdframe-names on` to show them
# shoot_headline_px = 42
# shoot_eyebrow_px = 18
# shoot_lowercase = false
# shoot_mat = 0.04
# shoot_small_floor = 0.04
# shoot_count_exp = 0.65   # tile size vs call count; higher = the loudest birds dominate more

# --- Panel ------------------------------------------------------------------
rotate = 90            # 90 or 270 if the frame hangs the other way up
saturation = 0.6       # Inky colour saturation, 0 to 1
mat = 0.0              # extra shrink of the content inside the A5 opening (0 = none)
opening = 0.7071       # opening height as a panel fraction; raise toward 0.98 for a bare panel
# panel = "el133uf1"   # force the 13.3" driver if auto-detect ever fails
# opening_ratio = 1.41421  # opening height / width (A-series mat); clamped to the panel width
# panel_size = [1200, 1600]  # portrait pixels; the screenshot follows this aspect
# title_frac = 0.065   # title height, fraction of the opening height
# collage_frac = 0.66  # max collage width, fraction of the opening width
# gap_frac = 0.1       # title-to-collage gap, fraction of the opening height
# shoot_label_min_px = 11  # smallest bird-name font (CSS px)

# --- ESPHome frame (7.3" Spectra 6 on a XIAO EE04) --------------------------
# Run this on the BirdNET server (install-server.sh writes it). Instead of
# driving a panel, display.py writes frame.png, frame-names.png and
# frame.json into export_dir for the ESP32 in frame/esphome/ to fetch. The
# folder must sit under the web root (~/BirdSongs/Extracted) to be served.
# output = "esphome"
# export_dir = "~/BirdSongs/Extracted/frame"
# base_url = "http://localhost"
# panel_size = [480, 800]
# opening = 0.96
# opening_ratio = 1.6667
# title_frac = 0.065
# collage_frac = 0.95
# gap_frac = 0.04
# shoot_label_min_px = 13
# paper_warmth = 0.12  # dot this share of the open background yellow, so it reads cream, not white

# --- Refresh cadence --------------------------------------------------------
# The panel refreshes only when the species set or a count bracket changes,
# plus a daily heal. Quiet hours are off so nocturnal detections still show;
# set quiet_start/quiet_end to a window to mute overnight.
quiet_start = 0        # 0/0 = always refresh on change; e.g. 22 and 6 mutes 22:00-06:00
quiet_end = 0
heal_hours = 24        # force a refresh at least this often

# --- Paths ------------------------------------------------------------------
state = "~/.birdframe/state.json"
cache = "~/.birdframe"
# 180s: a Zero 2 W takes ~70-120s to render the collage in headless
# chromium; the old 45s default made the frame silently never draw on
# that board (every shoot timed out waiting for tiles).
timeout = 180

# --- Only if your WHOLE site is behind basic-auth ---------------------------
# The AvianVisitors default leaves the collage and detection API public, so
# usually leave these out.
# basic_user = "monalisa"
# basic_pass = "..."
