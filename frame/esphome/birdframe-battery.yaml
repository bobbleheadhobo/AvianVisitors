# AvianVisitors frame, battery powered: deep sleeps between checks.
#   esphome run birdframe-battery.yaml   (over USB; see "Updating" below)
#
# Each wake: read the battery, join Wi-Fi, fetch frame.json, redraw only if
# the birds changed, then sleep until the next check, which follows the sun
# (birdframe/schedule.h):
#   dawn, 1 h before sunrise to 2 h after   every 10 min (the dawn chorus)
#   day, until 30 min after sunset          every 30 min
#   night                                   up to 3 h, waking as dawn opens
# Once the battery is low: every 2 h, with a small empty-battery mark in the
# corner. Without the time (no SNTP yet) it sleeps 30 min. A wake with
# nothing new costs a few seconds of Wi-Fi; the panel holds its image with
# no power.
#
# Keys wake the board at any time:
#   KEY0  redraw now
#   KEY1  toggle bird names
#   KEY2  stay awake 5 min, e.g. to flash an update over Wi-Fi; a tag along
#         the bottom of the panel shows while the window is open, with the
#         time it ends (also in Home Assistant: Update window, and Update
#         window ends, which counts down)
# Updating: press KEY2, then `esphome run birdframe-battery.yaml` and pick
# the network device; or flash over USB as the first time.

substitutions:
  name: birdframe
  server: http://192.168.0.112
  # Shown in Home Assistant as Firmware.
  build: Battery
  build_icon: mdi:battery
  # How long KEY2 keeps the frame awake for updates, in seconds.
  awake_window: 300s
  # The station's location, for sunrise and sunset.
  latitude: "35.0813"
  longitude: "-106.6212"
  timezone: America/Denver
  # The wake schedule, in seconds.
  dawn_before: 3600s
  dawn_after: 7200s
  dusk_after: 1800s
  sleep_dawn: 600s
  sleep_day: 1800s
  sleep_night_max: 10800s
  sleep_low: 7200s
  low_battery_volts: "3.6"

packages:
  common: !include birdframe/common.yaml

esphome:
  on_boot:
    # Safety net: never stay awake longer than 3 minutes unless KEY2 asked to.
    - priority: 600
      then:
        - delay: 180s
        - if:
            condition:
              lambda: "return id(wake_reason) != birdframe::WAKE_AWAKE;"
            then:
              - lambda: "birdframe::hold_key_pullups();"
              - deep_sleep.enter:
                  id: ds
                  sleep_duration: ${sleep_day}
    - priority: -100
      then:
        - deep_sleep.prevent: ds
        - lambda: |-
            id(wake_reason) = birdframe::wake_key();
            id(awake_mark) = id(wake_reason) == birdframe::WAKE_AWAKE;
            if (id(wake_reason) == birdframe::WAKE_NAMES) {
              id(names_on) = !id(names_on);
              ESP_LOGI("birdframe", "bird names %s", id(names_on) ? "on" : "off");
            }
            id(update_window).publish_state(id(wake_reason) == birdframe::WAKE_AWAKE);
        - switch.turn_on: battery_sense_enable
        - delay: 20ms
        - component.update: battery_voltage
        - switch.turn_off: battery_sense_enable
        - component.update: battery_level
        - lambda: |-
            float v = id(battery_voltage).state;
            // No reading, or USB with no cell attached: not "low".
            id(low_battery) = !std::isnan(v) && v > 2.5f && v < ${low_battery_volts}f;
            ESP_LOGI("birdframe", "battery %.2f V%s", v, id(low_battery) ? " (low)" : "");
        - wait_until:
            condition: wifi.connected
            timeout: 20s
        - if:
            condition: wifi.connected
            then:
              # KEY2: fix when the window ends before the tag is drawn, so
              # the panel and Home Assistant can both say. The clock usually
              # survives deep sleep; after a power cut SNTP sets it in a
              # moment. Without it the tag just says "5 min".
              - if:
                  condition:
                    lambda: "return id(wake_reason) == birdframe::WAKE_AWAKE;"
                  then:
                    - wait_until:
                        condition:
                          lambda: "return id(sntp_time).now().is_valid();"
                        timeout: 10s
                    - lambda: |-
                        auto now = id(sntp_time).now();
                        if (!now.is_valid()) return;
                        id(awake_until_ts) = now.timestamp + atoi("${awake_window}");
                        auto end = ESPTime::from_epoch_local(id(awake_until_ts));
                        char text[48];
                        snprintf(text, sizeof(text), "Awake for updates until %d:%02d %s",
                                 end.hour % 12 == 0 ? 12 : end.hour % 12, end.minute, end.hour < 12 ? "am" : "pm");
                        id(awake_text) = text;
                    - component.update: update_window_ends
              - script.execute:
                  id: check_frame
                  force: !lambda "return id(wake_reason) == birdframe::WAKE_REFRESH || id(wake_reason) == birdframe::WAKE_NAMES;"
              - script.wait: check_frame
              # Log this wake's level for Battery days left. SNTP has had
              # the whole check to set the clock if deep sleep lost it.
              - lambda: |-
                  auto now = id(sntp_time).now();
                  if (now.is_valid())
                    birdframe::battery_log_add(id(battery_log), (int32_t) (now.timestamp / 86400), id(battery_level).state);
              - component.update: battery_days_left
              # Give Home Assistant a moment to connect and take this wake's
              # readings (battery, status, Wi-Fi); it keeps them while the
              # frame sleeps. Without Home Assistant this costs at most 10 s.
              - component.update: wifi_rssi
              - wait_until:
                  condition: api.connected
                  timeout: 10s
              - if:
                  condition: api.connected
                  then:
                    - delay: 1s
        - if:
            condition:
              lambda: "return id(wake_reason) == birdframe::WAKE_AWAKE;"
            then:
              - logger.log: "KEY2: staying awake for updates"
              - text_sensor.template.publish:
                  id: frame_status
                  state: !lambda "return id(awake_text);"
              # Until the end time shown, or the full window without a clock.
              - delay: !lambda |-
                  auto now = id(sntp_time).now();
                  if (id(awake_until_ts) <= 0 || !now.is_valid()) return (uint32_t) atoi("${awake_window}") * 1000;
                  int64_t left = (int64_t) id(awake_until_ts) - now.timestamp;
                  return left > 0 ? (uint32_t) (left * 1000) : 0;
              # Take the tag down. If Wi-Fi is gone, the next wake does it.
              - lambda: "id(awake_mark) = false;"
              - binary_sensor.template.publish:
                  id: update_window
                  state: false
              - if:
                  condition: wifi.connected
                  then:
                    - script.execute:
                        id: check_frame
                        force: false
                    - script.wait: check_frame
        - lambda: |-
            global_preferences->sync();
            birdframe::hold_key_pullups();
        - deep_sleep.enter:
            id: ds
            sleep_duration: !lambda |-
              // Milliseconds. Substitutions read "600s"; drop the unit.
              auto secs = [](const char *t) { return (int) atoi(t); };
              int64_t s = secs("${sleep_low}");
              auto now = id(sntp_time).now();
              if (!id(low_battery)) {
                s = secs("${sleep_day}");
                if (now.is_valid()) {
                  birdframe::Schedule sched{secs("${dawn_before}"), secs("${dawn_after}"), secs("${dusk_after}"),
                                            secs("${sleep_dawn}"), secs("${sleep_day}"), secs("${sleep_night_max}")};
                  s = birdframe::next_sleep_s(now.timestamp, ${latitude}, ${longitude}, sched);
                }
              }
              ESP_LOGI("birdframe", "sleeping %d min", (int) (s / 60));
              return (uint32_t) (s * 1000);

globals:
  - id: wake_reason
    type: int
    initial_value: "0"
  # Daily mean battery levels for Battery days left: a birdframe::BatteryLog
  # (birdframe/battery.h) as raw words, since ESPHome declares globals before
  # it includes that header. Two zeros, not "{}" or "{0}", which also fit
  # the scalar constructor and so are ambiguous; the rest is zero too.
  - id: battery_log
    type: int32_t[20]
    restore_value: yes
    initial_value: "{0, 0}"
  # When the KEY2 window ends (Unix time; 0 until known).
  - id: awake_until_ts
    type: int
    initial_value: "0"

# Home Assistant: whether KEY2's update window is open, and when it ends.
# A timestamp shows there as "in 4 minutes", counting down.
binary_sensor:
  - platform: template
    id: update_window
    name: Update window
    icon: mdi:cellphone-arrow-down

text_sensor:
  - platform: template
    id: update_window_ends
    name: Update window ends
    device_class: timestamp
    update_interval: never
    lambda: |-
      if (id(awake_until_ts) <= 0) return {};
      return ESPTime::from_epoch_utc(id(awake_until_ts)).strftime("%Y-%m-%dT%H:%M:%SZ");

# The KEY2 tag shows a local time: pin the zone rather than take the one
# of whichever machine builds the firmware.
time:
  - id: !extend sntp_time
    timezone: ${timezone}

logger:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true

deep_sleep:
  id: ds
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - GPIO2
      - GPIO3
      - GPIO5

switch:
  - platform: gpio
    id: battery_sense_enable
    pin: GPIO6
    restore_mode: ALWAYS_OFF

sensor:
  - platform: adc
    id: battery_voltage
    name: Battery voltage
    pin: GPIO1
    attenuation: 12db
    update_interval: never
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    filters:
      - multiply: 2.0
  # The LiPo level from the resting voltage, along a typical discharge curve
  # (birdframe/battery.h). Unknown with no cell attached (USB only).
  - platform: template
    id: battery_level
    name: Battery level
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      return birdframe::lipo_percent(id(battery_voltage).state);
  # Days until empty at the recent rate of fall, from the daily means of
  # Battery level. Unknown for the first 3 days, and again for 3 days after
  # a charge.
  - platform: template
    id: battery_days_left
    name: Battery days left
    icon: mdi:battery-clock
    unit_of_measurement: d
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: "return birdframe::battery_days_left(id(battery_log), id(battery_level).state);"
